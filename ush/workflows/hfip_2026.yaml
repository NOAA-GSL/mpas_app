user:
  mesh_label: mpas_hfip2026
  workflow_blocks:
    - cold_start.yaml
    - post.yaml
    - graphics.yaml
    - scrubbing.yaml
    - archiving.yaml
    - tracker.yaml
    - archiving_tracker.yaml
    - start_cycle.yaml
  first_cycle: !!timestamp 2025-10-14T00:00:00
  last_cycle: !!timestamp 2025-10-14T00:00:00
  hpss_archive_dir: /path/to/hpss/dir
  ics:
    data_stores:
      - disk
  lbcs:
    data_stores:
      - disk
  input_grib: /scratch5/BMC/gsd-fv3-dev/MPAS_HFIP_2026/merged-input/104_sam_gfs_v17/out

data:
  mesh_files: /scratch3/BMC/wrfruc/Clark.Evans/MPAS-Model-v8.3.1/fix
  graphinfo_filename: "{{ user.mesh_label }}.graph.info"

platform:
  hrrr_fix:  /scratch3/BMC/wrfruc/Clark.Evans/MPAS-Model-v8.3.1/fix

  data:
    gfs:
      path: '{{user.input_grib}}'
      file_templates:
        - '{{ cycle.strftime("%Y%m%d%H") }}/gfs.t{{ hh }}z.pres_a.0p25.f{{ "%03d" | format(fcst_hr) }}.grib2'
        - '{{ cycle.strftime("%Y%m%d%H") }}/gfs.t{{ hh }}z.pres_b.0p25.f{{ "%03d" | format(fcst_hr) }}.grib2'

workflow:
  tasks:
    task_get_ics_data: !remove
    task_ungrib_ics:
      dependency:
        taskdep: !remove
        datadep:
          value:
            cyclestr:
              value: '{{ user.input_grib }}/@Y@m@d@H/ready'
    task_get_lbcs_data:
      walltime: 00:20:00
      dependency:
        datadep:
          value:
            cyclestr:
              value: '{{ user.input_grib }}/@Y@m@d@H/ready'
    metatask_post:
      task_combine_grib_#fhr#:
        command:
          cyclestr:
            value: 'cd {{ user.experiment_dir }}/@Y@m@d@H/upp/#fhr# && FHR=$( printf "%02d" "$((10##fhr#))") && cat PRSLEV.GrbF$FHR NATLEV.GrbF$FHR 2DFLD.GrbF$FHR >> ../COMBINED.GrbF$FHR'

get_lbcs_data:
  config:
    lead_times:
      - "{{ user.lbcs.offset_hours }}"
      - "{{ user.lbcs.offset_hours + forecast.mpas.length }}"
      - "{{ user.lbcs.interval_hours }}"

prepare_grib_ics:
  ungrib:
    gribfiles:
      - '{{ user.input_grib }}/{{ cycle.strftime("%Y%m%d%H") }}'

create_ics:
  mpas_init: &mpas_init
    files_to_copy:
      stream_list.atmosphere.diag_ugwp: "{{ user.mpas_app }}/parm/mpas/hfip_2026/stream_list.atmosphere.diag_ugwp"
      stream_list.atmosphere.diagnostics: "{{ user.mpas_app }}/parm/mpas/hfip_2026/stream_list.atmosphere.diagnostics"
      stream_list.atmosphere.output: "{{ user.mpas_app }}/parm/mpas/hfip_2026/stream_list.atmosphere.output"
      stream_list.atmosphere.surface: "{{ user.mpas_app }}/parm/mpas/hfip_2026/stream_list.atmosphere.surface"
    files_to_link:
      QNWFA_QNIFA_SIGMA_MONTHLY.dat: "{{ platform.hrrr_fix }}/../QNWFA_QNIFA_SIGMA_MONTHLY.dat"
      "{{ user.mesh_label }}.ugwp_oro_data.nc": "{{ platform.hrrr_fix }}/{{ user.mesh_label }}.ugwp_oro_data.nc" 
    namelist:
      update_values: &init_update
        data_sources:
          config_use_spechumd: true
        dimensions:
          config_nvertlevels: 79
          config_nsoillevels: 4
          config_nvegopt: 1
          config_nfglevels: 89
        interpolation_control:
          config_extrap_airtemp: linear
        preproc_stages:
          config_aerosol_climo: !remove
        vertical_grid:
          config_ztop: 38000.
          config_specified_zeta_levels: "{{ user.mpas_app }}/parm/mpas//L80_hfip.txt"
          config_blend_bdy_terrain: true


create_lbcs:
  mpas_init:
    <<: *mpas_init
    namelist:
      update_values:
        <<: *init_update
        lbcs:
          config_lbc_hydrometeors_gfs: true
          config_lbc_hydrometeors_rrfs: false


forecast:
  mpas:
    files_to_copy:
      stream_list.atmosphere.diag_ugwp: "{{ user.mpas_app }}/parm/mpas/hfip_2026/stream_list.atmosphere.diag_ugwp"
      stream_list.atmosphere.diagnostics: "{{ user.mpas_app }}/parm/mpas/hfip_2026/stream_list.atmosphere.diagnostics"
      stream_list.atmosphere.output: "{{ user.mpas_app }}/parm/mpas/hfip_2026/stream_list.atmosphere.output"
      stream_list.atmosphere.surface: "{{ user.mpas_app }}/parm/mpas/hfip_2026/stream_list.atmosphere.surface"
      freeze_water_data_tempo_v3: "{{ user.mpas_app }}/src/MPAS-Model/freeze_water_data_tempo_v3"
      qr_acr_qs_data_tempo_v3: "{{ user.mpas_app }}/src/MPAS-Model/qr_acr_qs_data_tempo_v3"
      qr_acr_qg_data_tempo_v3: "{{ user.mpas_app }}/src/MPAS-Model/qr_acr_qg_data_tempo_v3"
    files_to_link:
      CCN_ACTIVATE.BIN: !remove
      ccn_activate.bin: "{{ user.mpas_app }}/src/MPAS-Model/src/core_atmosphere/physics/physics_noaa/TEMPO/tables/ccn_activate.bin"
      QNWFA_QNIFA_SIGMA_MONTHLY.dat: "{{ platform.hrrr_fix }}/../QNWFA_QNIFA_SIGMA_MONTHLY.dat"
      "{{ user.mesh_label }}.ugwp_oro_data.nc": "{{ platform.hrrr_fix }}/{{ user.mesh_label }}.ugwp_oro_data.nc" 
    length: 6
    namelist:
      update_values:
        nhyd_model:
          config_dt: 24.
          config_number_of_sub_steps: 6
          config_apvm_upwinding: 0
        damping:
          config_zd: 33000.0
          config_mpas_cam_coef: 2.
          config_number_cam_damping_levels: 7
          config_rayleigh_damp_u: true
          config_rayleigh_damp_u_timescale_days: 2.5
        io:
          config_pio_num_iotasks: 810
          config_pio_stride: 10
        limited_area:
          config_apply_lbcs: true
        physics:
          config_pbl_schema: !remove
          config_frac_seaice: true
          config_radtlw_interval: 00:15:00
          config_radtsw_interval: 00:15:00
          config_gvf_update: true
          config_lsm_scheme: sf_noah
          num_soil_layers: 4
          config_mynn_sfcflux_water: 2
        physics_lsm_noahmp: !remove
        physics_mp_tempo:
          config_tempo_aerosolaware: true
          config_tempo_hailaware: true
          config_tempo_ml_for_bl_nc: true
        printout:
          config_print_global_minmax_vel: false
          config_print_detailed_minmax_vel: false
    streams:
      ugwp_oro_data_in:
        filename_template: "{{ user.mesh_label }}.ugwp_oro_data.nc"
        input_interval: initial_only
        type: input
        mutable: false
        io_type: "pnetcdf,cdf5"
        packages: ugwp_orog_stream
      diag_ugwp:
        type: output
        mutable: true
        filename_template: "{{ user.mesh_label }}.diag_ugwp.$Y-$M-$D_$h.$m.$s.nc"
        io_type: "pnetcdf,cdf5"
        clobber_node: replace_files
        packages: ugwp_diags_stream
        output_interval: 06:00:00
        files:
          - stream_list.atmosphere.diag_ugwp
      restart:
        mutable: false
        type: "input;output"
        filename_template: "restart.$Y-$M-$D_$h.$m.$s.nc"
        io_type: netcdf4
        input_interval: initial_only
        output_interval: "1_00:00:00"
        clobber_mode: replace_files
      surface: !remove

post:
  mpassit:
    nmldir: '{{ user.mpas_app }}/parm/mpassit/hfip_2026'
    parmdir: '{{ user.mpas_app }}/parm/mpassit/hfip_2026'
  upp:
    control_file: "{{ user.mpas_app }}/parm/upp/postxconfig-NT-hfip_mpas.txt"
    files_to_copy:
      postxconfig-NT.txt: "{{ user.mpas_app }}/parm/upp/postxconfig-NT-hfip_mpas.txt"
graphics:
  execution:
    batchargs:
      tasks_per_node: 192
      nodes: 1
  config:
    identifier: HFIP Experimental
    image_list: "{{ user.mpas_app }}/parm/pygraf/hfip_subset.yml"
    specs_file: "{{ user.mpas_app }}/parm/pygraf/hfip_specs.yml"
