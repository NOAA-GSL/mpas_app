user:
  mesh_label: conus3km
  platform: ursa
  workflow_blocks:
    - cold_start.yaml
  driver_validation_blocks:
    - prepare_grib_lbcs.ungrib
    - create_lbcs.mpas_init
    - forecast.mpas
    - post.upp
  ensemble_size: 2
create_lbcs:
  mpas_init:
    files_to_copy:
      "{{ user.mesh_label }}.init.nc": !remove
    files_to_hardlink:
      "{{ user.mesh_label }}.init.nc": "{{ create_ics.mpas_init['rundir'] }}/{{ user.mesh_label }}.init.nc"

forecast:
  mpas:
    execution:
      batchargs:
        walltime: "1:10:00"
    files_to_copy:
      "{{ user.mesh_label }}.init.nc": !remove
      steam_list/<files>: !glob "{{ platform.hrrr_fix }}/stream_list/hrrrv5/*"
    files_to_link:
      init.nc: /scratch3/BMC/wrfruc/cholt/mpas_app_work/rrfs_v2_ensemble/rt_run/20260526/rrfs_prep_ic_18_v2.1.3/enkf/mem0{{ "MEM" | env }}/mpasout.nc
      invariant.nc: "{{ platform.hrrr_fix }}/conus3km/conus3km.invariant.nc_L60_GEFS"
      MP_THOMPSON_QIautQS_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/MP_THOMPSON_QIautQS_DATA.DBL"
      MP_THOMPSON_QRacrQG_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/MP_THOMPSON_QRacrQG_DATA.DBL"
      MP_THOMPSON_QRacrQS_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/MP_THOMPSON_QRacrQS_DATA.DBL"
      MP_THOMPSON_freezeH2O_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/MP_THOMPSON_freezeH2O_DATA.DBL"
    namelist:
      base_file: /scratch3/BMC/wrfruc/cholt/mpas_app_work/rrfs_v2_ensemble/rt_run/namelist.atmosphere
      update_values:
        nhyd_model: !remove
        physics: !remove
        io:
          config_pio_num_iotasks: 5
          config_pio_stride: 160
        assimilation:
          config_jedi_da: false
        restart:
          config_do_dacycling: false
    rundir: '{{ user.experiment_dir }}/{{ cycle.strftime("%Y%m%d%H") }}/fcst_mem{{ "MEM" | env }}'
    streams:
      input:
        filename_template: init.nc
      invariant:
        mutable: False
        type: input
        precision: single
        filename_template: invariant.nc
        io_type: "pnetcdf,cdf5"
        input_interval: initial_only
workflow:
  tasks:
    task_mpas: !remove
    metatask_ensemble:
      var:
        MEM: "{% for mem in range(1, user.ensemble_size + 1) %}{{ ' %02d' % mem }}{% endfor %}"
      task_fcst_mem_#MEM#:
        command:
          cyclestr:
            value: 'source &MPAS_APP;/load_wflow_modules.sh &PLATFORM; && MEM=#MEM# &MPAS_APP;/scripts/mpas.py
              -c &EXPERIMENT_CONFIG;
              --cycle @Y-@m-@dT@H:@M:@S
              --key-path forecast'
        account: "{{ platform.account }}"
        join:
          cyclestr:
            value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
        walltime: "{{ forecast.mpas.execution.batchargs.walltime }}"
        cores: !remove
        nodes: "{{ forecast.mpas.execution.batchargs.nodes }}:ppn={{ forecast.mpas.execution.batchargs.tasks_per_node }}"
        partition: "{{ forecast.mpas.execution.batchargs.get('partition') }}"
        dependency:
          taskdep:
            attrs:
              task: mpas_lbcs
