workflow:
  tasks:
    metatask_latlon_regrid:
      var:
        fhr: "{% for h in range(0, forecast.mpas['length'] + 1, 6) %}{{ ' %03d' % h }}{% endfor %}"
      task_latlon_regrid_#fhr#:
        attrs:
          maxtries: 2
        command:
          cyclestr:
            value: 'source &MPAS_APP;/load_wflow_modules.sh &PLATFORM; &amp;&amp;
                    cd {{ user.experiment_dir }}/@Y@m@d@H &amp;&amp;
                    "&MPAS_APP;/scripts/run_latlon_regrid.sh"
                      @Y@m@d@H
                      "{{ platform.mpicmd }}"
                      "#fhr#"
                      "{{ latlon_regrid.new_grid }}"
                      "&MPAS_APP;"
                      '
        join:
          cyclestr:
              value: '&LOGDIR;/@Y@m@d@H/{{ jobname }}.log'
        walltime: "{{ latlon_regrid.execution.batchargs.walltime }}"
        cores: !int "{{ latlon_regrid.execution.batchargs.cores }}"
        partition: "{{ post.upp.execution.batchargs.partition }}"
        account: "{{ platform.account }}"
        dependency:
          taskdep:
            attrs:
              task: upp_#fhr#
    task_tracker:
      attrs:
        maxtries: 2
      command:
        cyclestr:
          value: 'source &MPAS_APP;/load_wflow_modules.sh &PLATFORM; ; python &MPAS_APP;/scripts/tracker.py
            -c &EXPERIMENT_CONFIG;
            --cycle @Y-@m-@dT@H:@M:@S
            --key-path tracker'
      account: "{{ platform.account }}"
      join:
        cyclestr:
          value: '&LOGDIR;/@Y@m@d@H/{{ jobname }}.log'
      walltime: "{{ tracker.gfdltracker.execution.batchargs.walltime }}"
      nodes: "{{ tracker.gfdltracker.execution.batchargs.nodes }}:ppn={{ tracker.gfdltracker.execution.batchargs.tasks_per_node }}"
      exclusive: "{{ tracker.gfdltracker.execution.batchargs.exclusive }}"
      partition: "{{ tracker.gfdltracker.execution.batchargs.partition }}"
      dependency:
        metataskdep:
          attrs:
            metatask: latlon_regrid
