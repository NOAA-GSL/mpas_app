
workflow:
  attrs:
    realtime: False
    scheduler: "{{ platform.scheduler }}"
  cycledef:
    - attrs:
        group: forecast
      spec: "{{ user.first_cycle.strftime('%Y%m%d%H%M') }} {{ user.last_cycle.strftime('%Y%m%d%H%M') }} {{user.cycle_frequency}}:00:00"
  log:
    value: "{{ user.experiment_dir }}/workflow.log"
  entities:
    EXPERIMENT_CONFIG: "{{user.experiment_dir}}/experiment.yaml"
    LOGDIR: "{{user.experiment_dir}}/log"
    MPAS_APP: "{{ user.mpas_app }}"
    PLATFORM: "{{ user.platform }}"
  tasks:
    task_get_ics_data:
      attrs:
        maxtries: 2
      command:
        cyclestr:
          value: 'source &MPAS_APP;/load_wflow_modules.sh &PLATFORM; &&
            &MPAS_APP;/scripts/get_external_data.py
            -c &EXPERIMENT_CONFIG;
            --cycle @Y-@m-@dT@H:@M:@S
            --key-path get_ics_data'
      account: "{{ platform.account }}"
      partition: "{{ platform.service_partition }}"
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      walltime: "{{ get_ics_data.execution.walltime }}"
      cores: !int "{{ get_ics_data.execution.cores }}"
    task_get_lbcs_data:
      attrs:
        maxtries: 2
      command:
        cyclestr:
          value: 'source &MPAS_APP;/load_wflow_modules.sh &PLATFORM; &&
            &MPAS_APP;/scripts/get_external_data.py
            -c &EXPERIMENT_CONFIG;
            --cycle @Y-@m-@dT@H:@M:@S
            --key-path get_lbcs_data'
      account: "{{ platform.account }}"
      partition: "{{ platform.service_partition }}"
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      walltime: "{{ get_lbcs_data.execution.walltime }}"
      cores: !int "{{ get_lbcs_data.execution.cores }}"
    task_ungrib_ics:
      attrs:
        maxtries: 2
      command:
        cyclestr:
          value: 'source &MPAS_APP;/load_wflow_modules.sh &PLATFORM; && &MPAS_APP;/scripts/ungrib.py
            -c &EXPERIMENT_CONFIG;
            --cycle @Y-@m-@dT@H:@M:@S
            --key-path prepare_grib_ics'
      account: "{{ platform.account }}"
      exclusive: "true"
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      walltime: "{{ prepare_grib_ics.ungrib.execution.batchargs.walltime }}"
      nodes: "{{ prepare_grib_ics.ungrib.execution.batchargs.nodes }}:ppn={{ prepare_grib_ics.ungrib.execution.batchargs.tasks_per_node }}"
      dependency:
        taskdep:
          attrs:
            task: get_ics_data
    task_ungrib_lbcs:
      attrs:
        maxtries: 2
      command:
        cyclestr:
          value: 'source &MPAS_APP;/load_wflow_modules.sh &PLATFORM; && &MPAS_APP;/scripts/ungrib.py
            -c &EXPERIMENT_CONFIG;
            --cycle @Y-@m-@dT@H:@M:@S
            --key-path prepare_grib_lbcs'
      account: "{{ platform.account }}"
      exclusive: "true"
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      walltime: "{{ prepare_grib_lbcs.ungrib.execution.batchargs.walltime }}"
      nodes: "{{ prepare_grib_lbcs.ungrib.execution.batchargs.nodes }}:ppn={{ prepare_grib_lbcs.ungrib.execution.batchargs.tasks_per_node }}"
      dependency:
        taskdep:
          attrs:
            task: get_lbcs_data
    task_mpas_ics: &mpas_init_task
      attrs:
        maxtries: 2
      command:
        cyclestr:
          value: 'source &MPAS_APP;/load_wflow_modules.sh &PLATFORM; && &MPAS_APP;/scripts/mpas_init.py
            -c &EXPERIMENT_CONFIG;
            --cycle @Y-@m-@dT@H:@M:@S
            --key-path create_ics'
      account: "{{ platform.account }}"
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      walltime: "{{ create_ics.mpas_init.execution.batchargs.walltime }}"
      cores: !int "{{ create_ics.mpas_init.execution.batchargs.cores }}"
      dependency:
        taskdep:
          attrs:
            task: ungrib_ics
    task_mpas_lbcs:
      attrs:
        maxtries: 2
      command:
        cyclestr:
          value: 'source &MPAS_APP;/load_wflow_modules.sh &PLATFORM; && &MPAS_APP;/scripts/mpas_init.py
            -c &EXPERIMENT_CONFIG;
            --cycle @Y-@m-@dT@H:@M:@S
            --key-path create_lbcs'
      account: "{{ platform.account }}"
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      walltime: "{{ create_lbcs.mpas_init.execution.batchargs.walltime }}"
      cores: !int "{{ create_lbcs.mpas_init.execution.batchargs.cores }}"
      dependency:
        and:
          taskdep_ics:
            attrs:
              task: mpas_ics
          taskdep_ungrib_lbcs:
            attrs:
              task: ungrib_lbcs
    task_mpas:
      attrs:
        maxtries: 2
      command: 
        cyclestr:
          value: 'source &MPAS_APP;/load_wflow_modules.sh &PLATFORM; && &MPAS_APP;/scripts/mpas.py
            -c &EXPERIMENT_CONFIG;
            --cycle @Y-@m-@dT@H:@M:@S
            --key-path forecast'
      account: "{{ platform.account }}"
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      walltime: "{{ forecast.mpas.execution.batchargs.walltime }}"
      nodes: "{{ forecast.mpas.execution.batchargs.nodes }}:ppn={{ forecast.mpas.execution.batchargs.tasks_per_node }}"
      partition: "{{ forecast.mpas.execution.batchargs.get('partition') }}"
      dependency:
        taskdep:
          attrs:
            task: mpas_lbcs
